<div class="location-box">
    <h2>Current Location: The Files</h2>
    <p><i>*folder 3 is open*</i></p>
</div>

<script>

/* WHICH FOLDER IS THIS PAGE? */
const folderNumber = 3;


/* RUNS AUTOMATICALLY WHEN THIS PAGE OPENS */

const readFolders = JSON.parse(
    localStorage.getItem("readFolders") || "[]"
);


/* ONLY COUNT THIS FOLDER ONCE */

if (!readFolders.includes(folderNumber)) {
    readFolders.push(folderNumber);

    localStorage.setItem(
        "readFolders",
        JSON.stringify(readFolders)
    );
}


/* RETURN BUTTON */

function returnFromFolder() {

    if (readFolders.length >= 4) {
        window.location.href = "popup-game.html";
    } else {
        window.location.href = "folders.html";
    }

}

</script>
