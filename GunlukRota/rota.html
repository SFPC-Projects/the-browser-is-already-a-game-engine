<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">

<title>Rota</title>

<style>

body {
    margin: 0;
    background: white;
    color: black;
    font-family: monospace;
}


/* ŞİİR */

.siir {
    width: 700px;
    max-width: 80%;
    margin: 100px auto;
}


pre {
    font-family: monospace;
    font-size: 18px;
    line-height: 1.8;
    white-space: pre-wrap;
}


/* ÇİLEK */

.cilek {
    color: red;
}


/* // */

.cizgi {
    display: inline-block;
    color: red;

    animation: kay 2s steps(5) infinite alternate;
}


@keyframes kay {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(25px);
    }

}


/* ÖRÜMCEK */

.orumcek {
    display: inline-block;

    color: blue;

    font-size: 24px;

    animation: orumcek 0.5s steps(2) infinite alternate;
}


@keyframes orumcek {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(3px,-2px);
    }

}


/* FOTOĞRAF */

.foto {
    display: block;

    margin: 180px auto 250px auto;
}

</style>


<style id="route-language-styles">
/* Minimal persistent language selector, isolated from original artwork */
#route-lang-selector {
 position:fixed!important; top:12px!important; right:12px!important;
 left:auto!important; bottom:auto!important; z-index:2147483647!important;
 display:flex!important; align-items:center!important; gap:0!important;
 box-sizing:border-box!important; padding:4px 6px!important; margin:0!important;
 background:rgba(255,255,255,.94)!important; border:1px solid #222!important;
 border-radius:0!important; color:#111!important; box-shadow:none!important;
 opacity:.85!important; font:12px/1.3 "Courier New",monospace!important;
 letter-spacing:0!important; text-transform:none!important; width:auto!important; height:auto!important;
}
#route-lang-selector:hover, #route-lang-selector:focus-within{opacity:1!important}
#route-lang-selector a {font:inherit!important; color:#111!important;
 padding:3px 6px!important; margin:0!important; text-decoration:none!important;
 display:inline-block!important; text-shadow:none!important; background:transparent!important;
 border:0!important; width:auto!important; height:auto!important; opacity:1!important;
}
#route-lang-selector a[aria-current="page"] {background:#111!important; color:#fff!important; font-weight:bold!important}
#route-lang-selector span {color:#777!important; font:inherit!important}
</style>
</head>


<body>


<div class="siir">


<pre>

Üşümek üzere olduğum yerde

<span class="cilek">küçük bir çilek.</span>


              <span class="cizgi">//</span>


                     Yağmurdan dolayı

       tuzağı açığa çıkmış ağ

hemen altında.



                            Kendi fotoğrafımı çekerken


                            <a href="orumcek.html" class="orumcek">örümceğe</a>

</pre>


</div>



<!-- FOTOĞRAF -->

<img
    src="foto.jpg"
    usemap="#image-map"
    class="foto"
>


<!-- FOTOĞRAFIN İÇİNDEKİ GİZLİ ÖRÜMCEK -->

<map name="image-map">

    <area
        target="_self"
        alt="orumcek"
        title="orumcek"
        href="orumcek.html"
        coords="1244,831,117"
        shape="circle"
    >

</map>



<nav id="route-lang-selector" aria-label="Language / Dil"><a href="rota.html" lang="tr" aria-current="page">TR</a><span aria-hidden="true">/</span><a href="en/rota.html" lang="en">EN</a></nav>
<script>
(function(){
  var selector=document.getElementById('route-lang-selector');
  if(!selector) return;
  var key='fifteen-day-route-switch';
  var language=document.documentElement.lang||'tr';
  var page=decodeURIComponent(location.pathname.split('/').pop()||'index.html');
  var specialMap=document.querySelectorAll('.dugum');
  function snapshot(){
    var details=[].map.call(document.querySelectorAll('details'),function(node){return node.open?1:0;});
    var state={page:page, from:language, details:details, x:window.scrollX, y:window.scrollY, hash:location.hash};
    if(specialMap.length){
      state.active=[].findIndex.call(specialMap,function(n){return n.classList.contains('aktif')});
      state.stage=!!(document.getElementById('sahne') && document.getElementById('sahne').style.display==='block');
    }
    try{sessionStorage.setItem(key,JSON.stringify(state));}catch(e){}
  }
  [].forEach.call(selector.querySelectorAll('a'),function(a){
    a.addEventListener('click',function(){
      snapshot();
      if(location.hash && a.getAttribute('href').indexOf('#')===-1) a.href+=location.hash;
    });
  });
  try{
    var stored=JSON.parse(sessionStorage.getItem(key)||'null');
    if(!stored || stored.page!==page || stored.from===language)return;
    sessionStorage.removeItem(key);
    [].forEach.call(document.querySelectorAll('details'),function(n,i){n.open=!!stored.details[i]});
    if(specialMap.length && typeof window.sonrakiDugum==='function'){
      var active=Math.max(0,Math.min(specialMap.length-1,stored.active||0));
      for(var j=0;j<active;j++)window.sonrakiDugum();
      if(stored.stage && typeof window.temsilBaslat==='function')window.temsilBaslat();
    }
    window.addEventListener('load',function(){
      setTimeout(function(){window.scrollTo({left:stored.x||0,top:stored.y||0,behavior:'instant'});},40);
    });
  }catch(e){}
})();
</script>
</body>

</html>
