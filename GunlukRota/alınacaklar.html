/* DEV TEHLİKELİDİR YAZISI */

.tehlikelidir {

    display: block;

    color: red;

    font-family: "Courier New", monospace;

    font-size: 14vw;

    font-weight: bold;

    line-height: 0.9;

    text-decoration: none;

    margin-top: 150px;
    margin-bottom: 100px;

    white-space: nowrap;

}


.tehlikelidir:hover {

    color: black;

}



/* ŞELALE BÖLÜMÜ */

.selale {

    position: relative;

    width: 100%;

    height: 500vh;

}



/* ŞELALE EKRANDA KALIYOR */

.selale-ekrani {

    position: sticky;

    top: 0;

    width: 100%;

    height: 100vh;

    overflow: hidden;

}



/* ŞELALE GIF */

.selale-gif {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

}



/* KOCAMAN ÇARPI - EN ÜSTTE */

.carpi {

    position: absolute;

    z-index: 11;

    top: 3%;

    left: 50%;

    transform: translateX(-50%);

    width: 350px;

    max-width: 70vw;

    cursor: pointer;

}



/* UYARI YAZISI - ÇARPININ ALTINDA */

.su-uyari {

    position: absolute;

    z-index: 10;

    top: 40%;

    left: 50%;

    transform: translateX(-50%);

    width: 95%;

    color: red;

    font-family: "Courier New", monospace;

    font-size: 6vw;

    font-weight: bold;

    text-align: center;

    animation: yanipson 0.5s infinite;

}



@keyframes yanipson {

    0% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }

}


</style>

<nav id="route-lang-selector" aria-label="Language / Dil"><a href="alınacaklar.html" lang="tr" aria-current="page">TR</a><span aria-hidden="true">/</span><a href="en/alınacaklar.html" lang="en">EN</a></nav>
<script>
(function(){
  var selector=document.getElementById('route-lang-selector');
  if(!selector) return;
  var key='fifteen-day-route-switch';
  var language=document.documentElement.lang||'tr';
  var page=decodeURIComponent(location.pathname.split('/').pop()||'index.html');
  var specialMap=document.querySelectorAll('.dugum');
  function snapshot(){
    var details=[].map.call(document.querySelectorAll('details'),function(node){return node.open?1:0;});
    var state={page:page, from:language, details:details, x:window.scrollX, y:window.scrollY, hash:location.hash};
    if(specialMap.length){
      state.active=[].findIndex.call(specialMap,function(n){return n.classList.contains('aktif')});
      state.stage=!!(document.getElementById('sahne') && document.getElementById('sahne').style.display==='block');
    }
    try{sessionStorage.setItem(key,JSON.stringify(state));}catch(e){}
  }
  [].forEach.call(selector.querySelectorAll('a'),function(a){
    a.addEventListener('click',function(){
      snapshot();
      if(location.hash && a.getAttribute('href').indexOf('#')===-1) a.href+=location.hash;
    });
  });
  try{
    var stored=JSON.parse(sessionStorage.getItem(key)||'null');
    if(!stored || stored.page!==page || stored.from===language)return;
    sessionStorage.removeItem(key);
    [].forEach.call(document.querySelectorAll('details'),function(n,i){n.open=!!stored.details[i]});
    if(specialMap.length && typeof window.sonrakiDugum==='function'){
      var active=Math.max(0,Math.min(specialMap.length-1,stored.active||0));
      for(var j=0;j<active;j++)window.sonrakiDugum();
      if(stored.stage && typeof window.temsilBaslat==='function')window.temsilBaslat();
    }
    window.addEventListener('load',function(){
      setTimeout(function(){window.scrollTo({left:stored.x||0,top:stored.y||0,behavior:'instant'});},40);
    });
  }catch(e){}
})();
</script>
