<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      position:fixed;
      inset:0;
      margin: 0;
      background-color:black;
      background-image: url("./secrets/toothman.png");

      perspective:800px;
      transform-style: preserve-3d;

    }

    #factory_bkg {
      position:fixed;
      /*top:0px;*/
      /*right:0;*/
      /*bottom:0px;*/
      /*min-width:100%;*/
      /*min-height:100%;*/

      transform:
        translate3d(-100px,-160px,-100px)
        scale3d(1,0.9,1.1);

    }

    #gas_station_wrap {
      position: fixed;
      top: 400px;
      left: 0;
      /*
      right: 0;

       */
      width: 2800px;
      height:600px
    }

    #gas_station_ext {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border:none;

    }

    #thebluedoor {
      position: absolute;
      left: 40.1%;  top: 52.5%;
      width: 20.0%;  height: 16.0%;


    }

    #path {
      position:fixed;
      transform:
      translate3d(200px,700px,-50px)
      scale3d(2.9,0.5,1.1);
    }

    #toothman-area {
      position: absolute;
      opacity: 10%;
      left: 1.1%; top:33%;
      width: 5.1%; height: 42%
    }

    #dialogdiv {
      position:fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      margin-right:16px;
      margin-top:20px;
      /*
      background: rgba(0,0,0, 0.5);

       */

    }

    #dialogdiv iframe {
      border-width: medium;
      border-style: solid;
      border-color: darksalmon;
      width:80vmin; height:80vmin;
    }





  </style>
    <meta charset="UTF-8">
    <title>outside</title>
  <link rel = "icon" href = "./secrets/toothman.png" type = "image/x-icon">

</head>

<body>

<div id = "factory_bkg">
  <video autoplay loop muted src="./outside.mp4">

  </video>
</div>
<div id="gas_station_wrap">


<iframe id = "gas_station_ext"
        frameborder = 0
        src = "./convenience.html">

</iframe>
  <a id = "thebluedoor" href="aisles-env.html"
  aria-label="go to aisles...">

  </a>

  <img src="./secrets/toothman.png" id="toothman-area"
       width="100%" height="100%"
      />



  </map>

</div>



<div id="path">
  <img src="desirepath.png"
  height = "600px"
  width = "800px"
  />
</div>


<audio autoplay loop src="./4digger.mp3"></audio>


<script type = "module">
  import { showDialog, dismissDialog } from '../../olive-events.js'

  const toothmanarea = document.getElementById('toothman-area');


  toothmanarea.addEventListener('mousemove', () => {
    toothmanarea.style.cursor = 'pointer';

  });

  toothmanarea.addEventListener('click', () => {
    showDialog('toothman intro');
    document.getElementById('gas_station_ext').contentWindow.postMessage({
      type: "hide-toothman"

    })

  });

  window.addEventListener("message", (event) => {
    if (event.data?.type === "dialog-closed") {
      dismissDialog();
      document.getElementById('gas_station_ext').contentWindow.postMessage({
        type: "unhide-toothman"
      })
    }

  });



</script>

</body>
</html>
