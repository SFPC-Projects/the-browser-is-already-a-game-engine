<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            overflow: hidden;
            position:fixed;
            perspective : 800px;
            transform-style:preserve-3d;

        }

        .gas_station_ext {
            position: absolute;
            image-rendering: pixelated;
            width: 100%;
            left: 0px;
            right:0px;

            transform:
                scale3d(3.65,1.3,1)
                translate3d(-70px,200px,-500px);

        }

        #toothman {
            position: relative;
            image-rendering: pixelated;
            transform:
                translate3d(0, 200px, -200px);
        }

        #junk {
            position:fixed;
            transform:
                    translate3d(240px, -270px, 0)
                    scale3d(0.66,0.55,1);

        }

        #toothman-area {
            position: absolute;
            opacity: 10%;
            left: 1.1%; top:33%;
            width: 5.1%; height: 42%
        }



    </style>
    <meta charset="UTF-8">
    <title>convenience</title>

</head>
<body>

<div class = 'gas_station_ext'>
    <img src = "./gas_station_glow.png">

</div>

<div id = "toothman">
    <img src = "./secrets/toothman.png">

</div>

<div id = "junk">
    <img src ="./junk59.gif"
         height = "600px"
         width = "800px"
    />
</div>

    window.addEventListener('message', (event) => {
        if (event.data?.type === "hide-toothman") {
            document.getElementById('toothman').style.visibility = 'hidden';

        }
    });

    window.addEventListener('message', (event) => {
        if (event.data?.type === "unhide-toothman") {
            document.getElementById('toothman').style.visibility = 'visible';
        }
    });


</script>
