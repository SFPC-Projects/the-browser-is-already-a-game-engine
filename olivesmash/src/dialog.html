<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    html, body { height: 100%; }

    body {
      overflow: hidden;
      margin:0;
      display:flex;
      color: black;
      background-color: wheat;
      font-family:Georgia, sans-serif;
      font-style : oblique 40deg;

    }

    .dialog { padding:12px 16px; display: flex; justify-content: center; }
    .stage {
      position: relative;
      width : 55%;
      aspect-ratio:1;
      animation:zoomout 2s ease-out both;

    }

    .stage img {
      position: absolute;
      width: 100%; height: 100%;
      object-fit:contain;
      transition: opacity 1s ease;

    }

    #dialog-img2 {opacity:0;}
    .facereveal #dialog-img1 {opacity:0;}
    .facereveal #dialog-img2 {opacity:1;}

    @keyframes zoomin { from { transform: scale(1); } to { transform: scale(2.5); } }
    h1 { font-size:1.05rem; }
    p { font-size:0.9rem; }
    .hint { font-size:0.7rem; font-style:italic; opacity:0.5; }

  </style>
    <meta charset="UTF-8">
    <title>dialog window</title>
</head>
<body>

<div class = "dialog">
  <div class = "stage" id = "stage">
    <img id = "dialog-img1" alt = "">
    <img id = "dialog-img2" alt = "">

  </div>
  <p id = "dialog-p1"></p>
  <br />
  <p id = "dialog-p2"></p>
  <br />
  <p id = "dialog-p3"></p>
  <br />
  <!-- <div class = "hint"> click anywhere to continue</div> -->


</div>

<script>
  window.addEventListener("message", (event) => {
    if (event.data?.type === "render-dialog") {
      const stage = document.getElementById("stage");
      const img1 = document.getElementById("dialog-img1");
      const img2 = document.getElementById("dialog-img2");

      if (event.data.img) {
        img1.src = event.data.img;
        img2.src = event.data.img2 || event.data.img;

      } else {
        stage.style.display = "none";

      }

      document.getElementById("dialog-p1").textContent = event.data.p1 ?? '';
      document.getElementById("dialog-p2").textContent = event.data.p2 ?? '';
      document.getElementById("dialog-p3").textContent = event.data.p3 ?? '';


      if (event.data.img2) {
        setTimeout(() => stage.classList.add("facereveal"), 1200)

      }

    }

  });

  window.addEventListener("click", () => {
    window.parent.postMessage({ type: "dialog-closed" }, window.location.origin);

  });

</script>

</body>
</html>
